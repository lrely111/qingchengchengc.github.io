baseURL = "http://192.168.100.101:1313/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "我的 Linux 学习博客"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "我的 Linux 学习博客"
  description = "Linux 基础及应用课程学习记录"
  keywords = ["Linux", "Hugo", "PaperMod", "博客"]
  author = "王文龙"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "你好，我是 王文龙 👋"
    Content = "长安大学 · 日语专业。这里记录《Linux 基础及应用》课程的学习笔记：目录与权限、grep/sed/awk 文本处理、Shell 脚本、Makefile 构建，以及在虚拟机里踩过的坑。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    disableHLJS = true

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 40

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 50

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 60

[markup.goldmark.renderer]
  unsafe = true
